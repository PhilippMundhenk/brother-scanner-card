name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check the committed bundle is current
        run: git diff --exit-code -- dist/ || { echo "dist/brother-scanner-card.js is stale, run npm run build and commit"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" || { echo "package.json version $version does not match tag $tag"; exit 1; }
          grep -q "CARD_VERSION = '$version'" src/brother-scanner-card.ts || { echo "CARD_VERSION in src does not match"; exit 1; }
      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/brother-scanner-card.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
